[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hound-tracer"
dynamic = ["version"]
description = "Hound Tracer: all-in-one QA/QC agent that auto-investigates CI/build/test failures, finds root cause, triages, and drafts tickets."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hound Tracer Maintainers", email = "fannyrizqi11@gmail.com" },
]
keywords = ["ci-cd", "root-cause-analysis", "triage", "devops", "qa", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "defusedxml>=0.7.1,<1.0.0",
    "openai>=1.30.0,<2.0.0",
    "gitpython>=3.1.40,<4.0.0",
    "pyyaml>=6.0,<7.0",
    "textual>=0.86.0,<1.0.0",
    "rich>=13.3.3,<15.0.0",
    "prompt-toolkit>=3.0.48,<4.0.0",
    "keyring>=25.0.0,<26.0.0",
    "platformdirs>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/youthisss/hound-tracer"
Documentation = "https://github.com/youthisss/hound-tracer/tree/main/docs"
Repository = "https://github.com/youthisss/hound-tracer.git"
Issues = "https://github.com/youthisss/hound-tracer/issues"
Changelog = "https://github.com/youthisss/hound-tracer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23,<5",
    "mypy>=1.17",
    "pip-audit>=2.9",
    "pytest",
    "pytest-cov>=6",
    "ruff>=0.12",
    "twine>=6,<7",
]

[project.scripts]
hound = "hound.cli:main"
hound-mcp = "hound.mcp.server:run_server"

[tool.hatch.build.targets.wheel]
packages = ["src/hound"]
core-metadata-version = "2.4"

[tool.hatch.version]
path = "src/hound/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "/dist",
    "/.vscode",
    "/demo-output",
    "/hound-output",
    "/portfolio-capture-output",
    "/portfolio-redaction-output",
    "/portfolio-screenshots",
]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures/sample-project"]
pythonpath = ["src", "."]
markers = [
    "unit: fast in-process logic tests",
    "integration: multi-component or store integration tests",
    "e2e: end-to-end command and workflow tests",
    "slow: heavyweight or high-iteration benchmark/stress tests",
    "network: tests targeting external network boundaries",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(?x)(src[\\\\/]hound[\\\\/]analyze[\\\\/](llm|rca)\\.py|src[\\\\/]hound[\\\\/](collector|tui)\\.py|src[\\\\/]hound[\\\\/]ingest[\\\\/]context\\.py)"
