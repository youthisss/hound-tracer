name: Provider Canary

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider ID; defaults to the HOUND_CANARY_PROVIDER variable
        required: false
        type: string
      model:
        description: Model ID; defaults to the HOUND_CANARY_MODEL variable
        required: false
        type: string
      base_url:
        description: Optional API base URL; defaults to the HOUND_CANARY_BASE_URL variable
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOUND_API_PROVIDER: ${{ inputs.provider || vars.HOUND_CANARY_PROVIDER }}
      HOUND_MODEL: ${{ inputs.model || vars.HOUND_CANARY_MODEL }}
      HOUND_BASE_URL: ${{ inputs.base_url || vars.HOUND_CANARY_BASE_URL }}
      HOUND_API_KEY: ${{ secrets.HOUND_CANARY_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
      - name: Verify canary configuration
        shell: bash
        run: |
          test -n "$HOUND_API_PROVIDER"
          test -n "$HOUND_MODEL"
          test -n "$HOUND_API_KEY"
      - name: Run strict live analysis
        shell: bash
        run: |
          mkdir canary-input
          cp tests/fixtures/pytest_fail.log canary-input/
          uv run hound analyze canary-input --output-dir canary-output \
            --no-dedup --require-llm
      - name: Verify live contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(next(Path("canary-output").glob("**/report.json")).read_text())
          provider = os.environ["HOUND_API_PROVIDER"]
          assert report["meta"]["engine"] == "merged", report["meta"]
          assert report["meta"]["llm"]["status"] == "succeeded", report["meta"]
          assert report["meta"]["model"].startswith(f"{provider}:"), report["meta"]
          assert report["meta"]["usage"].get("total_tokens", 0) > 0, report["meta"]
          PY
